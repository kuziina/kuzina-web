<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Калькулятор</title>
    <link rel="stylesheet" type="text/css" href="calc.css">
</head>

<body>

    <h2>Калькулятор</h2>
    <div class="container">
        <div id="pic">
            <img src="trap1.png">
        </div>
        <form>
            <h4>Тип входных данных:</h4>
            <p>
                <input type="radio" id="indata_sides" name="indata" checked="true">Основания и боковая сторона
                <br>
                <input type="radio" id="indata_angle" name="indata">Основания и угол между основанием и боковой стороной
            </p>
            <p>
                <input onclick="display()" type="button" value="Показать">
            </p>
            <hr>
            <div class="input_data">
            </div>
            <hr>
            <p>
                <label>
                    <b>НАЙТИ:</b>
                    <br>
                    <select id="calculatedValue" name="calculatedValue" multiple size="3">
                        <option value="0" id="d"> диагонали </option>
                        <option value="1" id="p"> периметр </option>
                        <option value="2" id="s"> площадь </option>
                    </select>
                </label>
            </p>
            <p>
            <p>
                <input type="button" value="Вычислить" onclick="calculate(this.form)">
                <input type="button" value="Очистить" onclick="clearData()">
            </p>
        </form>
        <div id="output">
        </div>
    </div>
    <script src="calc.js">
    </script>

</body>

</html>
